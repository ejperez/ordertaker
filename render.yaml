services:
  - type: web
    name: ordertaker-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run build -w @ordertaker/backend
    startCommand: npm run db:deploy -w @ordertaker/backend && npm run start -w @ordertaker/backend
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_PRODUCT_BUCKET
        value: product-images
      - key: SUPABASE_PAYMENT_PROOFS_BUCKET
        value: payment-proofs
      - key: FRONTEND_ORIGIN
        sync: false
      - key: OWNER_NAME
        sync: false
      - key: OWNER_EMAIL
        sync: false
      - key: OWNER_PASSWORD
        sync: false
  - type: web
    name: ordertaker-store
    runtime: static
    rootDir: frontend
    buildCommand: npm ci --include=dev && npm run build -w @ordertaker/frontend
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
